---

- name: Validate RKE2 inventory
  hosts: localhost:all
  gather_facts: false
  tasks:
    - name: Require shared RKE2 inventory groups
      ansible.builtin.assert:
        that:
          - groups.get('rke2_servers', []) | length > 0
          - >-
            groups.get('rke2_all', []) | length == 0 or
            (
              ((groups.get('rke2_servers', []) + groups.get('rke2_agents', [])) | unique)
              | difference(groups.get('rke2_all', []))
              | length
            ) == 0
          - >-
            groups.get('rke2_all', []) | length == 0 or
            (
              groups.get('rke2_all', [])
              | difference(((groups.get('rke2_servers', []) + groups.get('rke2_agents', [])) | unique))
              | length
            ) == 0
        fail_msg: >-
          This playbook requires an inventory with rke2_servers and optional
          rke2_agents groups. If rke2_all is populated, it must contain exactly
          the rke2_servers and rke2_agents hosts. For BCIT TLU infrastructure, run
          from this repository root with the sibling ../ansible checkout
          available, or pass a compatible inventory explicitly with -i.
      run_once: true
      delegate_to: localhost

- name: RKE2 play
  hosts: >-
    {{
      'rke2_all'
      if (groups.get('rke2_all', []) | length > 0)
      else (
        'rke2_servers:rke2_agents'
        if (
          groups.get('rke2_servers', []) | length > 0 and
          groups.get('rke2_agents', []) | length > 0
        )
        else (
          'rke2_servers'
          if (groups.get('rke2_servers', []) | length > 0)
          else 'all:!all'
        )
      )
    }}
  any_errors_fatal: true
  gather_facts: false
  become: true
  roles:
    - role: rke2
