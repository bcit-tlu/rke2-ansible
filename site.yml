---

- name: Validate RKE2 inventory
  hosts: localhost:all
  gather_facts: false
  tasks:
    - name: Require shared RKE2 inventory groups
      ansible.builtin.assert:
        that:
          - groups.get('rke2_servers', []) | length > 0
          - rke2_selected_role_hosts | length > 0
        fail_msg: >-
          This playbook requires an inventory with rke2_servers and optional
          rke2_agents groups, and the run must select at least one RKE2 server
          or agent host (for example, with --limit clusterNN).
          For BCIT TLU infrastructure, run from this repository root with the
          sibling ../ansible checkout available, or pass a compatible inventory
          explicitly with -i.
      vars:
        rke2_selected_role_hosts: >-
          {{
            ((groups.get('rke2_servers', []) + groups.get('rke2_agents', [])) | unique)
            | intersect(ansible_play_hosts_all)
          }}
      run_once: true
      delegate_to: localhost

- name: RKE2 play
  hosts: >-
    {{
      (
        (['rke2_servers'] if groups.get('rke2_servers', []) | length > 0 else [])
        + (['rke2_agents'] if groups.get('rke2_agents', []) | length > 0 else [])
      ) | join(':') or 'all:!all'
    }}
  any_errors_fatal: true
  gather_facts: false
  become: true
  roles:
    - role: rke2
