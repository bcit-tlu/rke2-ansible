---

- name: Create the /etc/rancher/rke2 config dir
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    recurse: true

# combine host and group vars to form primary rke2_config
- name: Combine host and group config vars
  ansible.builtin.set_fact:
    temp_group_rke2_config: "{{ cluster_rke2_config | default({}) | ansible.builtin.combine((group_rke2_config | default({})), list_merge='prepend_rp') }}"

# combine host and group vars to form primary rke2_config
- name: Combine host and group config vars
  ansible.builtin.set_fact:
    rke2_config: "{{ temp_group_rke2_config | default({}) | ansible.builtin.combine((host_rke2_config | default({})), list_merge='prepend_rp') }}"

# write final config
- name: Create config.yaml
  ansible.builtin.blockinfile:
    path: /etc/rancher/rke2/config.yaml
    block: "{{ rke2_config | to_nice_yaml(indent=0) }}"
    create: true
    mode: "0640"
  notify: Restart {{ service_name }}

# Kubelet settings that are only expressible as KubeletConfiguration (not as
# RKE2 config.yaml keys) are delivered as a drop-in. RKE2 launches the kubelet
# with --config-dir and writes only 00-rke2-defaults.conf there, leaving other
# files untouched across restarts and upgrades, so a 50- prefixed file is
# applied after the defaults without contending with RKE2's own file or with
# the 10-/20- names RKE2 reserves for `kubelet-arg: config=/config-dir=`.
#
# Prefer this over `kubelet-arg: eviction-hard=...`: kubelet re-parses command
# line flags after merging config, and --eviction-hard binds the whole map, so
# a flag would silently discard RKE2's imagefs/nodefs thresholds. Drop-in files
# are merged as an RFC 7386 JSON merge patch, so map keys combine individually
# and unset keys keep their existing values.
- name: Ensure the kubelet config drop-in directory exists
  ansible.builtin.file:
    path: "{{ rke2_kubelet_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: rke2_kubelet_config | length > 0

- name: Create the ansible-managed kubelet config drop-in
  ansible.builtin.copy:
    content: |
      ## This is an Ansible managed file, contents will be overwritten ##
      {{
        {
          'apiVersion': 'kubelet.config.k8s.io/v1beta1',
          'kind': 'KubeletConfiguration',
        }
        | ansible.builtin.combine(rke2_kubelet_config)
        | to_nice_yaml(indent=2)
      }}
    dest: "{{ rke2_kubelet_config_dir }}/{{ rke2_kubelet_config_dropin_filename }}"
    owner: root
    group: root
    mode: "0600"
  when: rke2_kubelet_config | length > 0
  notify: Restart {{ service_name }}

- name: Remove the ansible-managed kubelet config drop-in
  ansible.builtin.file:
    path: "{{ rke2_kubelet_config_dir }}/{{ rke2_kubelet_config_dropin_filename }}"
    state: absent
  when: rke2_kubelet_config | length == 0
  notify: Restart {{ service_name }}
