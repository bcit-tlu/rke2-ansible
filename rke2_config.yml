---
- name: Configure RKE2
  hosts: >-
    {{
      (
        (['rke2_servers'] if groups.get('rke2_servers', []) | length > 0 else [])
        + (['rke2_agents'] if groups.get('rke2_agents', []) | length > 0 else [])
      ) | join(':') or 'all:!all'
    }}
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars:
    rke2_config_only: true
  pre_tasks:
    - name: Require the config tag  # noqa run-once[task]
      ansible.builtin.assert:
        that:
          - "'rke2_config' in ansible_run_tags"
        fail_msg: >-
          This playbook is config-only and must be run with
          --tags rke2_config.
      run_once: true
      tags:
        - always
  roles:
    - role: rke2
