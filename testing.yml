---
- name: Validate RKE2 inventory
  hosts: localhost:all
  gather_facts: false
  tasks:
    - name: Require shared RKE2 inventory groups
      ansible.builtin.assert:
        that:
          - groups.get('rke2_servers', []) | length > 0
        fail_msg: >-
          This playbook requires an inventory with rke2_servers and optional
          rke2_agents groups. For BCIT TLU infrastructure, run from this
          repository root with the sibling ../ansible checkout available, or
          pass a compatible inventory explicitly with -i.
      run_once: true

- name: Testing play
  hosts: >-
    {{
      (
        (['rke2_all'] if (groups.get('rke2_all', []) | length > 0) else [])
        + ['rke2_servers']
        + (['rke2_agents'] if (groups.get('rke2_agents', []) | length > 0) else [])
      ) | join(':')
    }}
  become: true
  roles:
    - role: testing
