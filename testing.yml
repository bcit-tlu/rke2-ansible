---
- name: Validate RKE2 inventory
  hosts: localhost:rke2_all:rke2_cluster
  gather_facts: false
  tasks:
    - name: Require shared RKE2 inventory groups
      ansible.builtin.assert:
        that:
          - (groups.get('rke2_all', []) + groups.get('rke2_cluster', [])) | length > 0
          - groups.get('rke2_servers', []) | length > 0
        fail_msg: >-
          This playbook requires an inventory with rke2_servers and either
          rke2_all or rke2_cluster groups. For BCIT TLU infrastructure, run
          from this repository root with the sibling ../ansible checkout
          available, or pass a compatible inventory explicitly with -i.
      run_once: true

- name: Testing play
  hosts: rke2_all:rke2_cluster
  become: true
  roles:
    - role: testing
