---
# Apply the worker label through the API because kubelets cannot self-apply it.

- name: Scope worker labelling to the selected hosts
  ansible.builtin.set_fact:
    rke2_worker_labels_servers: >-
      {{
        groups.get('rke2_servers', [])
        | select('in', ansible_play_hosts_all)
        | list
      }}
    rke2_worker_labels_workers: >-
      {{
        groups.get('rke2_agents', [])
        | select('in', ansible_play_hosts_all)
        | list
      }}
  run_once: true

- name: Label selected worker nodes from the first selected server
  run_once: true
  delegate_to: "{{ rke2_worker_labels_servers | first | default(inventory_hostname, true) }}"
  when:
    - rke2_worker_labels_servers | length > 0
    - rke2_worker_labels_workers | length > 0
  block:
    - name: Read worker node objects
      ansible.builtin.command:
        argv:
          - "{{ rke2_worker_labels_kubectl }}"
          - --kubeconfig
          - "{{ rke2_worker_labels_kubeconfig }}"
          - get
          - nodes
          - -o
          - json
      register: rke2_worker_labels_nodes
      changed_when: false
      check_mode: false

    - name: Initialise worker node lookup records
      ansible.builtin.set_fact:
        rke2_worker_labels_node_records: []

    - name: Build worker node lookup records
      ansible.builtin.set_fact:
        rke2_worker_labels_node_records: >-
          {{
            rke2_worker_labels_node_records + [{
              'name': item.metadata.name,
              'hostname': (item.metadata.labels | default({})).get('kubernetes.io/hostname', ''),
              'name_short': item.metadata.name | regex_replace('\..*$', ''),
              'hostname_short': (item.metadata.labels | default({})).get('kubernetes.io/hostname', '')
                | regex_replace('\..*$', ''),
              'labels': item.metadata.labels | default({})
            }]
          }}
      loop: "{{ (rke2_worker_labels_nodes.stdout | from_json)['items'] | default([]) }}"

    - name: Initialise resolved worker nodes
      ansible.builtin.set_fact:
        rke2_worker_labels_resolved_nodes: []

    - name: Resolve selected workers to Kubernetes nodes
      ansible.builtin.set_fact:
        rke2_worker_labels_resolved_nodes: >-
          {{
            rke2_worker_labels_resolved_nodes + [{
              'inventory_hostname': item,
              'node': (
                (
                  (rke2_worker_labels_node_records
                   | selectattr('name', 'equalto', item)
                   | list)
                  + (rke2_worker_labels_node_records
                     | selectattr('hostname', 'equalto', item)
                     | list)
                  + (rke2_worker_labels_node_records
                     | selectattr('name_short', 'equalto', item | regex_replace('\..*$', ''))
                     | list)
                  + (rke2_worker_labels_node_records
                     | selectattr('hostname_short', 'equalto', item | regex_replace('\..*$', ''))
                     | list)
                ) | first | default({}, true)
              )
            }]
          }}
      loop: "{{ rke2_worker_labels_workers }}"

    - name: Warn about workers missing from the Kubernetes node list
      ansible.builtin.debug:
        msg: >-
          Skipping worker {{ item.inventory_hostname }} because no matching
          Kubernetes node was found.
      loop: "{{ rke2_worker_labels_resolved_nodes }}"
      when: item.node | length == 0

    - name: Apply the worker role label to worker nodes
      ansible.builtin.command:
        argv:
          - "{{ rke2_worker_labels_kubectl }}"
          - --kubeconfig
          - "{{ rke2_worker_labels_kubeconfig }}"
          - label
          - node
          - "{{ item.node.name }}"
          - "{{ rke2_worker_labels_key }}={{ rke2_worker_labels_value }}"
          - --overwrite
      loop: "{{ rke2_worker_labels_resolved_nodes }}"
      changed_when: true
      when: >-
        item.node | length > 0 and
        item.node.labels.get(rke2_worker_labels_key, '') != rke2_worker_labels_value
